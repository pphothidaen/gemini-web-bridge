name: CD — Deploy & Secret Sync

# ─── Triggers ─────────────────────────────────────────────────────
# THE single deploy authority for this repo. ci.yml is verify-only.
#
# There is no staging. An earlier version of this file deployed to
# `gemini-web-bridge-staging` first, but the deployment never went
# anywhere: `npx wrangler deploy --env staging` run from cloudflare-worker/
# auto-discovers the REPO-ROOT wrangler.jsonc, which has no [env.staging]
# section, so wrangler ignored the flag (with a warning) and deployed to
# the root config's name — `gemini-web-bridge`, i.e. PRODUCTION. Every
# push therefore deployed production twice, once via the "staging" job
# and again via the production job, while the staging worker sat frozen
# at v4.3.4.
#
# That also made the production approval gate decorative: production was
# already overwritten by a job that has no `environment:` and therefore
# no reviewer. Removing the staging job is what makes the gate real.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'extension-cloudflare/**'
      - 'scripts/build-extension.py'
  workflow_dispatch:
    inputs:
      skip_doppler:
        description: 'Skip Doppler secret fetch (use GitHub Secrets fallback)'
        required: false
        type: boolean
        default: false

# Serialize deploys. Without this, two pushes in quick succession ran two
# `wrangler deploy`s against the same worker at once; whichever finished last
# won, and secrets could be written by one run while the other deployed.
#
# cancel-in-progress MUST be true. With false, a run left waiting at the
# production approval gate holds this lock indefinitely: a KAN-159-era run
# (created 2026-09-27 18:53) sat 'waiting' for ~1.5 days and every later CD
# run queued behind it as pending with zero jobs started — no deploy executed
# at all in that window (KAN-173). Latest-wins is also the correct semantics
# for a single worker: a wrangler deploy is one atomic upload, production only
# changes when a run finishes, so superseding an older gate-waiting run with
# the newest one leaves production exactly where the newest successful deploy
# put it.
concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKER_DIR: 'cloudflare-worker'
  PROD_WORKER: 'prod'
  WSS_ENDPOINT: 'wss://prod.gemini-web-bridge.workers.dev/bridge'
  OPENAI_ENDPOINT: 'https://prod.gemini-web-bridge.workers.dev/v1'

jobs:
  # ─── Doppler Secret Fetch (Primary) ───────────────────────────────
  fetch-secrets:
    name: Fetch Secrets from Doppler
    runs-on: ubuntu-26.04
    outputs:
      source: ${{ steps.fetch.outputs.source }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Doppler CLI
        run: |
          # The installer shells out to dpkg, which needs root on the runner.
          # Without sudo it dies with "requested operation requires superuser
          # privilege" and every downstream secret fetch fails.
          curl -Ls https://cli.doppler.com/install.sh | sudo sh
          sudo ln -sf ~/.doppler/bin/doppler /usr/local/bin/doppler

      # Fail loudly and early. The previous version ran
      #   doppler setup ... 2>/dev/null || true
      # then `doppler secrets get`, which returned empty strings, so the job
      # died 3 steps later with a misleading "BRIDGE_AUTH_TOKEN is empty".
      # A missing service token is a configuration error with a known fix —
      # say so, and say exactly where to get it.
      - name: Preflight — require a usable DOPPLER_SERVICE_TOKEN
        if: ${{ inputs.skip_doppler != 'true' }}
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOPPLER_SERVICE_TOKEN" ]; then
            echo "::error::DOPPLER_SERVICE_TOKEN is not set on this repository."
            echo ""
            echo "Create a service token, then add it as a repo secret:"
            echo "  1. Doppler Dashboard -> Access -> Service Tokens -> Add"
            echo "  2. Name: github-actions-cd"
            echo "  3. Project: gemini-web-bridge   Config: prd_worker"
            echo "  4. Access: Read.  Set an expiry (90 days) — re-issue when it lapses."
            echo "  5. gh secret set DOPPLER_SERVICE_TOKEN   (paste the dp.st.* value)"
            echo ""
            echo "Or re-run with skip_doppler=true to fall back to GitHub Secrets."
            exit 1
          fi

          # A non-empty token is not the same as a USABLE token, and access to
          # the PROJECT is still not the same as access to the CONFIG.
          #
          # Two real mis-scopings have been hit here, and each one produces a
          # confusing failure two steps later, reported as if the secrets were
          # missing from Doppler when they are present and readable:
          #
          #   1. Wrong project. A valid dp.st.* scoped to `horo-consultant`
          #      lists no gemini-web-bridge at all.
          #   2. Right project, wrong config. A token issued for config `prd`
          #      DOES list gemini-web-bridge, so a project-level check passes
          #      it — then every `secrets get --config prd_worker` is denied
          #      and the fetch step reports "BRIDGE_AUTH_TOKEN /
          #      CLIENT_API_KEY are missing from ... prd_worker".
          #
          # So test the exact read the fetch step performs, here, where the
          # cause is still unambiguous — and report which projects/configs the
          # token can actually reach so the mis-scoping is readable from the
          # log alone.
          if ! doppler secrets get BRIDGE_AUTH_TOKEN \
               --token "$DOPPLER_SERVICE_TOKEN" \
               --project gemini-web-bridge --config prd_worker --plain \
               >/dev/null 2>&1; then
            echo "::error::DOPPLER_SERVICE_TOKEN cannot read BRIDGE_AUTH_TOKEN from gemini-web-bridge/prd_worker."
            echo ""
            if ! doppler projects --token "$DOPPLER_SERVICE_TOKEN" --json \
                 | grep -q '"id": *"gemini-web-bridge"'; then
              echo "The token does not reach the 'gemini-web-bridge' project at all."
              echo "Projects this token CAN currently reach:"
              doppler projects --token "$DOPPLER_SERVICE_TOKEN" 2>/dev/null || echo "  (none)"
            else
              echo "The token reaches 'gemini-web-bridge', but not the 'prd_worker' config."
              echo "Configs this token CAN currently read in that project:"
              doppler configs --token "$DOPPLER_SERVICE_TOKEN" \
                --project gemini-web-bridge 2>/dev/null || echo "  (none)"
              echo ""
              echo "Note: cd.yml deploys from prd_worker, which holds the app"
              echo "secrets. The 'prd' config holds only DOPPLER_* metadata."
            fi
            echo ""
            echo "Fix: Doppler Dashboard -> Access -> Service Tokens -> Add"
            echo "  Project: gemini-web-bridge   Config: prd_worker   Access: Read"
            echo "then: gh secret set DOPPLER_SERVICE_TOKEN"
            echo ""
            echo "Or re-run with skip_doppler=true to fall back to GitHub Secrets."
            exit 1
          fi
          echo "✅ DOPPLER_SERVICE_TOKEN can read BRIDGE_AUTH_TOKEN from gemini-web-bridge/prd_worker"

      - name: Fetch secrets from Doppler
        id: fetch
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_doppler }}" = "true" ]; then
            echo "⚠️ Doppler fetch skipped (skip_doppler=true)"
            echo "source=github_secrets" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Pass the token explicitly via --token rather than `doppler setup`.
          # `doppler setup` writes a config file and silently binds whatever
          # project/config it can infer; --token is unambiguous and stateless.
          #
          # `|| true` is required: under `set -e` a failed command substitution
          # aborts the step on the spot, before the empty-value check below can
          # explain what happened. Capture the failure and report it instead.
          bridge=$(doppler secrets get BRIDGE_AUTH_TOKEN \
                     --token "$DOPPLER_SERVICE_TOKEN" \
                     --project gemini-web-bridge --config prd_worker --plain) || true
          client=$(doppler secrets get CLIENT_API_KEY \
                     --token "$DOPPLER_SERVICE_TOKEN" \
                     --project gemini-web-bridge --config prd_worker --plain) || true

          # An expired or revoked service token fails here, not with a generic
          # "empty" further down. Say which of the two it is.
          if [ -z "$bridge" ] || [ -z "$client" ]; then
            if ! doppler me --token "$DOPPLER_SERVICE_TOKEN" >/dev/null 2>&1; then
              echo "::error::DOPPLER_SERVICE_TOKEN is invalid or expired. Re-issue it in Doppler Dashboard -> Access -> Service Tokens, then: gh secret set DOPPLER_SERVICE_TOKEN"
            else
              echo "::error::Doppler returned an empty value — check BRIDGE_AUTH_TOKEN / CLIENT_API_KEY exist in gemini-web-bridge/prd_worker"
            fi
            exit 1
          fi

          # Only `source` is exported as a job output. The token VALUES are
          # deliberately NOT passed downstream: job outputs are recorded in the
          # run metadata and are readable by anyone with Actions log access.
          # ($GITHUB_ENV would be worse still — it only applies to the current
          # job and does not cross the job boundary at all.)
          #
          # Each deploy job therefore re-reads the two secrets from Doppler
          # itself, using the masked DOPPLER_SERVICE_TOKEN. Two cheap API calls
          # in exchange for never materialising a live credential in run
          # metadata.
          echo "source=doppler" >> $GITHUB_OUTPUT
          echo "✅ Verified BRIDGE_AUTH_TOKEN and CLIENT_API_KEY exist in gemini-web-bridge/prd_worker"

  # ─── Production Deploy ────────────────────────────────────────────
  # This is now the ONLY job that touches a worker, so this is the only
  # place production can change — and `environment: production` below is
  # what gates it.
  #
  # The gate is real only if a protection rule exists in
  # Settings -> Environments. Verified: `production` has a
  # `required_reviewers` rule. Without it GitHub creates the environment
  # implicitly and starts this job unattended, which is exactly what
  # happened while the staging job existed.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-26.04
    # `fetch-secrets` is listed so the `source` output referenced in the
    # summary below resolves — job outputs are not readable from a sibling
    # job unless it is a declared dependency.
    needs: [fetch-secrets]
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install worker dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Install Doppler CLI
        if: ${{ inputs.skip_doppler != 'true' }}
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sudo sh
          sudo ln -sf ~/.doppler/bin/doppler /usr/local/bin/doppler

      - name: Resolve worker secrets
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          GH_BRIDGE_AUTH_TOKEN: ${{ secrets.BRIDGE_AUTH_TOKEN }}
          GH_CLIENT_TOKEN: ${{ secrets.CLIENT_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_doppler }}" = "true" ] || [ -z "$DOPPLER_SERVICE_TOKEN" ]; then
            echo "⚠️ Using GitHub Secrets (skip_doppler or no service token)"
            [ -n "$GH_BRIDGE_AUTH_TOKEN" ] || { echo "::error::BRIDGE_AUTH_TOKEN missing from GitHub Secrets"; exit 1; }
            [ -n "$GH_CLIENT_TOKEN" ] || { echo "::error::CLIENT_API_KEY missing from GitHub Secrets"; exit 1; }
            bridge="$GH_BRIDGE_AUTH_TOKEN"; client="$GH_CLIENT_TOKEN"
          else
            # `|| true` so a doppler failure is caught by the empty-value
            # check below rather than aborting the step under `set -e`.
            bridge=$(doppler secrets get BRIDGE_AUTH_TOKEN --token "$DOPPLER_SERVICE_TOKEN" \
                       --project gemini-web-bridge --config prd_worker --plain) || true
            client=$(doppler secrets get CLIENT_API_KEY --token "$DOPPLER_SERVICE_TOKEN" \
                       --project gemini-web-bridge --config prd_worker --plain) || true
            if [ -z "$bridge" ] || [ -z "$client" ]; then
              echo "::error::Could not resolve worker secrets from Doppler (token invalid/expired, or the secret is unset)"
              exit 1
            fi
          fi
          echo "::add-mask::$bridge"
          echo "::add-mask::$client"
          {
            echo "bridge_auth_token=$bridge"
            echo "client_token=$client"
          } >> $GITHUB_ENV

      - name: Set production worker secrets
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRIDGE_AUTH_TOKEN: ${{ env.bridge_auth_token }}
          CLIENT_API_KEY: ${{ env.client_token }}
        run: |
          echo "$BRIDGE_AUTH_TOKEN" | npx wrangler secret put BRIDGE_AUTH_TOKEN
          echo "$CLIENT_API_KEY" | npx wrangler secret put CLIENT_API_KEY

      - name: Deploy to production
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production deployment
        env:
          PROD_BASE_URL: https://prod.gemini-web-bridge.workers.dev
        run: |
          sleep 5
          HEALTH=$(curl -s --retry 3 --retry-delay 2 --max-time 30 "$PROD_BASE_URL/health")
          if echo "$HEALTH" | grep -q '"status": *"ok"'; then
            echo "✅ Production health OK"
          else
            echo "❌ Production health check failed"
            echo "$HEALTH"
            exit 1
          fi

      - name: Deployment summary
        if: success()
        run: |
          echo "## 🚀 Production Deployed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Worker deployed via cd.yml (secrets: ${{ needs.fetch-secrets.outputs.source }})" >> $GITHUB_STEP_SUMMARY
          echo "WSS: \`${{ env.WSS_ENDPOINT }}\`" >> $GITHUB_STEP_SUMMARY
          echo "OpenAI: \`${{ env.OPENAI_ENDPOINT }}\`" >> $GITHUB_STEP_SUMMARY
