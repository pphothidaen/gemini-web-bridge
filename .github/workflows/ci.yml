name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  WORKER_DIR: 'cloudflare-worker'

jobs:
  # ─── Job 1: Lint & Syntax Check ────────────────────────────────
  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Syntax check worker
        working-directory: ${{ env.WORKER_DIR }}
        run: node --check src/index.js

  # ─── Job 2: Unit Tests ──────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Run tests
        working-directory: ${{ env.WORKER_DIR }}
        run: node --test tests/ 2>&1 | tee test-results.txt

      - name: Test summary
        working-directory: ${{ env.WORKER_DIR }}
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─── Job 3: Security Scan ──────────────────────────────────────
  security-scan:
    name: Security Scan (Secret Detection)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report scan status
        run: echo "## 🔐 Security Scan" >> $GITHUB_STEP_SUMMARY

  # ─── Job 4: Deploy to Production ────────────────────────────────
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --name gemini-web-bridge \
            --compatibility-date 2026-09-12 \
            --compatibility-flag nodejs_compat

      - name: Verify deployment
        run: |
          sleep 5
          HEALTH=$(curl -s https://gemini-web-bridge.pansakorn-pho.workers.dev/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status": *"ok"' || (echo "Health check failed" && exit 1)

      - name: Deploy summary
        if: success()
        run: |
          echo "## 🚀 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "✅ Worker deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://gemini-web-bridge.pansakorn-pho.workers.dev" >> $GITHUB_STEP_SUMMARY
