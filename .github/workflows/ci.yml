name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  WORKER_DIR: 'cloudflare-worker'

jobs:
  # ─── Job 1: Lint & Syntax Check ────────────────────────────────
  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Syntax check worker
        working-directory: ${{ env.WORKER_DIR }}
        run: node --check src/index.js

  # ─── Job 2: Unit Tests ──────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Run tests
        working-directory: ${{ env.WORKER_DIR }}
        run: node --test tests/ 2>&1 | tee test-results.txt

      - name: Test summary
        working-directory: ${{ env.WORKER_DIR }}
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─── Job 3: Security Scan ──────────────────────────────────────
  security-scan:
    name: Security Scan (Secret Detection)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action needs full history to diff against its baseline;
          # shallow checkouts make the git wrapper fail with "stderr is not empty".
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report scan status
        run: echo "## 🔐 Security Scan" >> $GITHUB_STEP_SUMMARY

  # ─── Job 3b: Blueteam — Dependency Audit ────────────────────────
  blueteam-deps:
    name: Blueteam — Dependency Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        working-directory: ${{ env.WORKER_DIR }}
        run: npm audit --audit-level=high

      - name: Check lockfile integrity
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          echo "## 📦 Dependency Audit" >> $GITHUB_STEP_SUMMARY
          npm audit --json 2>/dev/null | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const meta = d.metadata || {};
            console.log('Vulnerabilities:', JSON.stringify(meta.vulnerabilities || {}));
            console.log('Total dependencies:', meta.totalDependencies || 'n/a');
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Audit summary unavailable (non-critical)" >> $GITHUB_STEP_SUMMARY

  # ─── Job 5: Build & Package Extension ──────────────────────────
  # RULE: Extension MUST be built via build-extension.py before zipping.
  # Never zip extension-cloudflare/ directly — it contains __BRIDGE_AUTH_TOKEN__ placeholder.
  # Load unpacked from dist/extension/ OR download the CI artifact.
  package-extension:
    name: Build & Package Extension
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build extension (inject secrets)
        env:
          BRIDGE_AUTH_TOKEN: ${{ secrets.BRIDGE_AUTH_TOKEN }}
          CLIENT_API_TOKEN: ${{ secrets.CLIENT_API_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          echo "Building extension with secrets injected..."
          python3 scripts/build-extension.py --output dist/extension

      - name: Verify no placeholders remain
        run: |
          echo "=== Scanning for unresolved placeholders ==="
          PLACEHOLDERS=(
            "__BRIDGE_AUTH_TOKEN__"
            "__CLIENT_API_TOKEN__"
            "__WORKER_URL__"
            "__MCP_ENDPOINT__"
            "__WSS_ENDPOINT__"
            "__OPENAI_ENDPOINT__"
          )
          FOUND=0
          for p in "${PLACEHOLDERS[@]}"; do
            if grep -r "$p" dist/extension/ --include="*.js" --include="*.json" --include="*.html" 2>/dev/null; then
              echo "❌ FAIL: Found unresolved placeholder: $p"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo " CRITICAL: Extension contains unresolved placeholders!    "
            echo " This means secrets were NOT injected during build.      "
            echo " Do NOT distribute this zip — it will fail with 401.    "
            echo "════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✅ No unresolved placeholders found"

      - name: Package extension zip
        run: |
          cd ${{ github.workspace }}
          # Extract version from manifest
          VERSION=$(python3 -c "import json; m=json.load(open('dist/extension/manifest.json')); print(m['version'])")
          echo "Packaging extension version: $VERSION"

          # Create release directory
          mkdir -p release

          # Zip dist/extension/ (built output, NOT source)
          cd dist/extension
          zip -r ../../release/gemini-bridge-v${VERSION}.zip . \
            -x "*/__MACOSX/*" \
            -x "*/.DS_Store" \
            -x "*/.git/*" \
            -x "*.pyc" \
            -x "*/__pycache__/*" \
            -x ".gitignore"
          cd ../..

          # Verify zip contents
          echo "=== Zip contents ==="
          unzip -l release/gemini-bridge-v${VERSION}.zip | head -25

          # Verify manifest.json is present and valid
          unzip -p release/gemini-bridge-v${VERSION}.zip manifest.json > /tmp/manifest-check.json
          python3 -c "
          import json, sys
          m = json.load(open('/tmp/manifest-check.json'))
          assert 'manifest_version' in m, 'Missing manifest_version'
          assert 'version' in m, 'Missing version'
          assert 'background' in m, 'Missing background'
          assert 'content_scripts' in m, 'Missing content_scripts'
          print(f'✅ manifest.json valid — version {m[\"version\"]}')
          "

          echo "ZIP_PATH=release/gemini-bridge-v${VERSION}.zip" >> $GITHUB_ENV

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-bridge-extension
          path: release/gemini-bridge-v*.zip
          retention-days: 90

      - name: Package summary
        run: |
          echo "## 📦 Extension Built & Packaged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh release/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Important" >> $GITHUB_STEP_SUMMARY
          echo "Download from: **Actions → Artifacts → gemini-bridge-extension**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**DO NOT** load unpacked from \`extension-cloudflare/\` (contains placeholders)" >> $GITHUB_STEP_SUMMARY
          echo "**DO** load from \`dist/extension/\` after running \`python3 scripts/build-extension.py\`" >> $GITHUB_STEP_SUMMARY

  # ─── Job 6: Redteam — Token Validation ────────────────────────
  redteam-token-test:
    name: Redteam — Token Validation
    runs-on: ubuntu-latest
    needs: [security-scan, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Token validation (no hardcoded secrets)
        env:
          OLD_CLIENT_TOKEN: ${{ secrets.OLD_CLIENT_API_TOKEN }}
          CURRENT_CLIENT_TOKEN: ${{ secrets.CLIENT_API_TOKEN }}
          OLD_BRIDGE_TOKEN: ${{ secrets.OLD_BRIDGE_AUTH_TOKEN }}
        run: |
          echo "## 🔴 Redteam — Token Validation" >> $GITHUB_STEP_SUMMARY

          # Test 1: Old compromised token MUST return 401
          if [ -n "$OLD_CLIENT_TOKEN" ]; then
            HTTP_CODE=$(curl -s --retry 3 --retry-all-errors --retry-delay 2 -o /dev/null -w "%{http_code}" -X POST \
              https://gemini-web-bridge.pansakorn-pho.workers.dev/v1/chat/completions \
              -H "Authorization: Bearer $OLD_CLIENT_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"model":"gemini-3.8-flash-thinking","messages":[{"role":"user","content":"test"}]}')

            if [ "$HTTP_CODE" = "401" ]; then
              echo "✅ Old CLIENT_API_TOKEN rejected (HTTP 401)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ SECURITY ISSUE: Old token returned HTTP $HTTP_CODE (expected 401)" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            echo "ℹ️ OLD_CLIENT_API_TOKEN not set — skipping old token test" >> $GITHUB_STEP_SUMMARY
          fi

          # Test 2: Current token MUST return 200 or 503 (not 401)
          HTTP_CODE=$(curl -s --retry 3 --retry-all-errors --retry-delay 2 -o /dev/null -w "%{http_code}" -X POST \
            https://gemini-web-bridge.pansakorn-pho.workers.dev/v1/chat/completions \
            -H "Authorization: Bearer $CURRENT_CLIENT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"model":"gemini-3.8-flash-thinking","messages":[{"role":"user","content":"test"}]}')

          if [ "$HTTP_CODE" = "401" ]; then
            echo "❌ Current token rejected (HTTP 401) — deployment broken!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Current CLIENT_API_TOKEN accepted (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
          fi

          # Test 3: Old bridge token must also be dead
          if [ -n "$OLD_BRIDGE_TOKEN" ]; then
            BRIDGE_CODE=$(curl -s --retry 3 --retry-all-errors --retry-delay 2 -o /dev/null -w "%{http_code}" \
              https://gemini-web-bridge.pansakorn-pho.workers.dev/bridge/auth-check \
              -H "x-bridge-token: $OLD_BRIDGE_TOKEN")
            if [ "$BRIDGE_CODE" = "401" ]; then
              echo "✅ Old BRIDGE_AUTH_TOKEN rejected" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Old BRIDGE_AUTH_TOKEN response: HTTP $BRIDGE_CODE" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # ─── Job 4: Deploy to Production ────────────────────────────────
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: blueteam-deps
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install worker dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy

      - name: Verify deployment
        run: |
          sleep 5
          HEALTH=$(curl -s https://gemini-web-bridge.pansakorn-pho.workers.dev/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status": *"ok"' || (echo "Health check failed" && exit 1)

      - name: Deploy summary
        if: success()
        run: |
          echo "## 🚀 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "✅ Worker deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://gemini-web-bridge.pansakorn-pho.workers.dev" >> $GITHUB_STEP_SUMMARY
