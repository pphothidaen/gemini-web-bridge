name: CI
# Verify-only. Production deployment lives in cd.yml — see the note at the
# bottom of this file. Keeping deploy in one place is deliberate: this file
# and cd.yml used to both run `wrangler deploy` on every push to main,
# concurrently and unserialized.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two runs of this workflow overlap on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKER_DIR: 'cloudflare-worker'

jobs:
  # ─── Job 0: Workflow self-check ─────────────────────────────────
  # Runs first and deliberately does NOT need this workflow to load. A
  # workflow GitHub cannot parse produces a run with zero jobs, so the
  # breakage is invisible from the UI: no failed step, no log line naming
  # the cause. This job turns that into an ordinary red X.
  validate-workflows:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check workflows for constructs GitHub rejects
        run: python3 scripts/validate-workflows.py

  # ─── Job 1: Lint & Syntax Check ────────────────────────────────
  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Syntax check worker
        working-directory: ${{ env.WORKER_DIR }}
        run: node --check src/index.js

  # ─── Job 2: Unit Tests ──────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          # KAN-224: tags are required input, not decoration. The default
          # fetch-depth is 1, which fetches no tags at all, so
          # `git tag -l 'v[0-9]*'` came back empty on the runner and
          # extension-version-line.test.mjs failed there while passing on any
          # developer machine that had cloned with tags.
          #
          # The default is deliberate for most jobs — this one reads history to
          # compare a release tag against the committed version, which is the
          # entire assertion. Without the tags there is nothing to compare and
          # the test can only be wrong.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Run tests
        working-directory: ${{ env.WORKER_DIR }}
        # Must match package.json's "test" script. The bare-directory form
        # (`node --test tests/`) dies with MODULE_NOT_FOUND on newer Node
        # before running a single test, silently reporting a green build.
        #
        # `set -o pipefail` is REQUIRED. Piping into tee makes the step's exit
        # status tee's, which is always 0, so a failing suite reported a green
        # build — 9 tests were failing in CI while the job passed. GitHub runs
        # this step under `bash -e`, which does not imply pipefail.
        #
        # The live-server tokens are supplied so integration.test.mjs actually
        # runs instead of skipping. CLIENT_API_KEY is the one those tests
        # authenticate with — CF_TOKEN is a different credential and the
        # worker rejects it on /v1/models with 401.
        #
        # BRIDGE_LIVE_EXTENSION is deliberately NOT set: the remaining
        # chat/completions round-trip needs a browser extension connected to the
        # DO, which is never true in CI, and it is gated on that flag so it skips
        # with a reason rather than failing on infrastructure state.
        #
        # BRIDGE_PHASE5_TARGET_ISOLATED is deliberately NOT set either. The Phase
        # 5 lease tests take the single-instance connection lease and can evict
        # a real extension, and CI runs against production. A /health probe
        # cannot make that safe — during a genuine reconnect the DO reports zero
        # connections, so the probe reads "free" precisely when a competing
        # upgrade is most likely to displace the live client. They now require an
        # explicit acknowledgement that the target host has no real user.
        #
        # Note the WebSocket upgrade test is NOT gated on either flag: it needs
        # the lease to be FREE, and skips with a reason when a live extension
        # holds it, so it is safe to run from CI.
        env:
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
          BRIDGE_AUTH_TOKEN: ${{ secrets.BRIDGE_AUTH_TOKEN }}
        run: |
          set -o pipefail
          node --test 'tests/**/*.test.mjs' 2>&1 | tee test-results.txt

      - name: Test summary
        working-directory: ${{ env.WORKER_DIR }}
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─── Job 3: Security Scan ──────────────────────────────────────
  security-scan:
    name: Security Scan (Secret Detection)
    runs-on: ubuntu-latest
    needs: test
    # `always()` so the secret scan still runs when the test job is red (it
    # currently is — see the known pre-existing failures), and no `main`-only
    # gate so pull requests are scanned too: the September-2026 token leak
    # reached the default branch because the only secret gate was main-only.
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action needs full history to diff against its baseline;
          # shallow checkouts make the git wrapper fail with "stderr is not empty".
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        # NO `with:` block on purpose.
        #
        # This previously passed `config: .gitleaks.toml`. gitleaks-action@v2
        # declares no `inputs` at all, so that key was rejected at runtime with
        #   "Unexpected input(s) 'config', valid inputs are ['']"
        # and the custom rules were silently never applied — the job reported
        # green while scanning with the DEFAULT ruleset, which has no rule
        # matching the `hermes-` / `gemini-bridge-` prefixes this config exists
        # to catch. A secret gate that silently scans with the wrong ruleset is
        # worse than no gate, because it is trusted.
        #
        # The supported mechanism is the GITLEAKS_CONFIG env var. (The action
        # also auto-detects `gitleaks.toml` at the repo root, but this repo's
        # file is `.gitleaks.toml` — dot-prefixed, so it is NOT auto-detected.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Report scan status
        run: echo "## 🔐 Security Scan" >> $GITHUB_STEP_SUMMARY

  # ─── Job 3b: Blueteam — Dependency Audit ────────────────────────
  blueteam-deps:
    name: Blueteam — Dependency Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        working-directory: ${{ env.WORKER_DIR }}
        run: npm audit --audit-level=high

      - name: Check lockfile integrity
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          echo "## 📦 Dependency Audit" >> $GITHUB_STEP_SUMMARY
          npm audit --json 2>/dev/null | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const meta = d.metadata || {};
            console.log('Vulnerabilities:', JSON.stringify(meta.vulnerabilities || {}));
            console.log('Total dependencies:', meta.totalDependencies || 'n/a');
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Audit summary unavailable (non-critical)" >> $GITHUB_STEP_SUMMARY

  # ─── Job 5: Build & Package Extension ──────────────────────────
  # RULE: Extension MUST be built via build-extension.py before zipping.
  # Never zip extension-cloudflare/ directly — it contains __BRIDGE_AUTH_TOKEN__ placeholder.
  # Load unpacked from dist/extension/ OR download the CI artifact.
  package-extension:
    name: Build & Package Extension
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      extension-version: ${{ steps.bump-version.outputs.version }}
      extension-prerelease: ${{ steps.bump-version.outputs.prerelease }}
    steps:
      # fetch-depth 0 is REQUIRED by the version step: actions/checkout
      # defaults to a shallow single-commit clone with no tags, so
      # `git tag -l` would come back empty and every build would silently
      # fall back to the committed manifest — which is the collision this
      # whole scheme exists to fix.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        id: bump-version
        env:
          # fetch-depth 0 above gives us every tag; without it
          # `git describe` cannot see tags and silently falls through to the
          # bump path, which is how this produced the same version forever.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # Chrome requires manifest "version" to be 1-4 dot-separated integers,
          # each <= 65535, so the 4th slot is the only place a build counter can
          # go. Keep that in mind when reading the schemes below.
          read_manifest_version() {
            python3 -c "import json; print(json.load(open('extension-cloudflare/manifest.json'))['version'])"
          }

          # Scheme 1 — an exact tag on this commit wins. This is the release
          # path: `git tag v4.5.0` produces 4.5.0 and nothing else.
          if git describe --exact-match --tags 2>/dev/null; then
            TAG=$(git describe --tags --exact-match 2>/dev/null)
            VERSION="${TAG#v}"
            echo "Using exact tag: $TAG -> $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scheme 2 — otherwise derive from the latest tag, which is what makes
          # the counter monotonic across builds. Previously this read the version
          # out of the COMMITTED manifest.json, which CI never commits back, so
          # every run computed 4.4.3+1 and every artifact was named v4.4.4.
          LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$LATEST" ]; then
            BASE="${LATEST#v}"
            echo "Latest tag: $LATEST"
          else
            # No tags exist yet in this repo. Fall back to the committed
            # manifest so numbering starts from the real current version.
            BASE=$(read_manifest_version)
            echo "No tags found; using committed manifest version $BASE as base"
          fi

          MAJ=$(echo "$BASE" | cut -d. -f1)
          MIN=$(echo "$BASE" | cut -d. -f2)
          PAT=$(echo "$BASE" | cut -d. -f3)

          # KAN-224: fail closed when the tag base is behind the committed
          # version. Without this the mislabel is invisible — for a month every
          # build on a 4.7.21 codebase was published as "4.4.3.<run>", which
          # reads like a deliberate pre-release scheme rather than an error, and
          # nothing in CI said so. The build stamp agreed with the manifest
          # (4.7.21) while the artifact CI named was 4.4.3.x, so neither one
          # could catch it: two self-consistent authorities that disagreed.
          #
          # Compare on the first three components only, because BASE may carry a
          # 4th build counter from a tag that does.
          BASE3="$MAJ.$MIN.$PAT"
          MANIFEST=$(read_manifest_version)
          # sort -V gives the numerically lowest of the two, so if the tag base is
          # the lower one it is the stale one.
          LOWEST=$(printf '%s\n%s\n' "$BASE3" "$MANIFEST" | sort -V | head -1)

          if [ "$LOWEST" != "$BASE3" ]; then
            echo "::error title=Version base is stale::The newest tag is $LATEST (base $BASE3) but cloudflare-worker/package.json declares $MANIFEST. Every build would be published as $BASE3.<run>, mislabelling a $MANIFEST release. Tag the release commit: git tag -a v$MANIFEST <sha> -m 'Release $MANIFEST' && git push origin v$MANIFEST"
            exit 1
          fi

          if [ "$BASE3" != "$MANIFEST" ]; then
            echo "::warning title=Tag base is ahead of the manifest::Newest tag base is $BASE3 but package.json declares $MANIFEST. Building from the tag; check whether the manifest bump was reverted."
          fi

          # 4th component = CI run number. Monotonic, unique per build, and
          # traceable back to the exact workflow run. Clamped to 65535 because
          # Chrome rejects any version component above that.
          BUILD=$(( RUN_NUMBER > 65535 ? 65535 : RUN_NUMBER ))
          VERSION="$MAJ.$MIN.$PAT.$BUILD"

          echo "Untagged commit -> $VERSION  (base $BASE, run #$RUN_NUMBER)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=true" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKER_DIR }}/package-lock.json

      - name: Install worker dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Build extension (inject secrets + version bump)
        env:
          BRIDGE_AUTH_TOKEN: ${{ secrets.BRIDGE_AUTH_TOKEN }}
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://prod.gemini-web-bridge.workers.dev' }}
          MCP_ENDPOINT: ${{ secrets.MCP_ENDPOINT || 'https://prod.gemini-web-bridge.workers.dev/mcp' }}
        run: |
          cd ${{ github.workspace }}
          echo "Building extension v${{ steps.bump-version.outputs.version }} with secrets injected..."
          python3 scripts/build-extension.py \
            --output dist/extension \
            --create-zip \
            --set-version ${{ steps.bump-version.outputs.version }}

      - name: Verify no placeholders remain
        run: |
          echo "=== Scanning for unresolved placeholders ==="
          PLACEHOLDERS=(
            "__BRIDGE_AUTH_TOKEN__"
            "__CLIENT_API_KEY__"
            "__WORKER_URL__"
            "__MCP_ENDPOINT__"
            "__WSS_ENDPOINT__"
            "__OPENAI_ENDPOINT__"
          )
          FOUND=0
          for p in "${PLACEHOLDERS[@]}"; do
            if grep -r "$p" dist/extension/ --include="*.js" --include="*.json" --include="*.html" 2>/dev/null; then
              echo "❌ FAIL: Found unresolved placeholder: $p"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo " CRITICAL: Extension contains unresolved placeholders!    "
            echo " This means secrets were NOT injected during build.      "
            echo " Do NOT distribute this zip — it will fail with 401.    "
            echo "════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✅ No unresolved placeholders found"

      - name: Verify release zip
        run: |
          cd ${{ github.workspace }}
          VERSION=${{ steps.bump-version.outputs.version }}
          echo "=== Release zip: extension-${VERSION}.zip ==="
          ls -lh dist/extension-${VERSION}.zip
          echo ""
          echo "=== Zip contents ==="
          unzip -l dist/extension-${VERSION}.zip
          echo ""
          echo "=== Verify manifest in zip ==="
          unzip -p dist/extension-${VERSION}.zip manifest.json | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          assert m['version'] == '${VERSION}', f'Version mismatch: {m[\"version\"]} != ${VERSION}'
          assert m['manifest_version'] == 3
          print(f'✅ manifest.json valid — version {m[\"version\"]}')
          print(f'   Name: {m[\"name\"]}')
          "

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          # Name carries the run number, so every build yields a distinct,
          # retrievable artifact. The previous name was version-only and the
          # version never changed between runs, so successive builds reused
          # one name and overwrote each other's download slot.
          name: gemini-bridge-extension-v${{ steps.bump-version.outputs.version }}-run${{ github.run_number }}
          path: dist/extension-*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Package summary
        run: |
          echo "## 📦 Extension Built & Packaged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.bump-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}  •  **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/extension-*.zip >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Important" >> $GITHUB_STEP_SUMMARY
          echo "Download from: **Actions → Artifacts → gemini-bridge-extension-v${{ steps.bump-version.outputs.version }}-run${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**DO NOT** load unpacked from \`extension-cloudflare/\` (contains placeholders)" >> $GITHUB_STEP_SUMMARY
          echo "**DO** load from \`dist/extension/\` after running \`python3 scripts/build-extension.py\`" >> $GITHUB_STEP_SUMMARY

  # ─── Job 5b: Comment build result on the Jira ticket ───────────
  #
  # Closes the loop between the two systems the repo already uses: the
  # governance hook requires every commit to carry a KAN-<id>, and this
  # posts the build outcome back to that ticket so the ticket reflects
  # reality without anyone copying run URLs by hand.
  #
  # Security posture — this step holds a credential and is therefore
  # deliberately narrow:
  #   * main only. A pull_request from a fork would otherwise run this
  #     with the secret available to untrusted code.
  #   * opt-in via the secret's presence, and never fatal, so a missing or
  #     expired token cannot turn a green build red or block a release.
  #   * the token is passed only in the request header, never echoed, and
  #     `set +x` guards against a trace.
  #
  # Setup (one-off):
  #   gh secret set JIRA_CI_TOKEN --repo pphothidaen/gemini-web-bridge
  #   gh variable set JIRA_ACCOUNT_EMAIL --repo pphothidaen/gemini-web-bridge
  #
  # Neither a job-level nor a step-level `if:` may reference the `secrets`
  # context — GitHub reports "Unrecognized named-value: 'secrets'" and refuses
  # to load the file, so the run lists zero jobs and shows only a generic
  # "workflow file issue" banner. `secrets` is usable in `env:` and nowhere in
  # a condition.
  #
  # So the secret is exposed as an env var and the step tests THAT. An unset
  # secret expands to an empty string, which is exactly the not-configured-yet
  # case, and the step skips instead of failing.
  jira-sync:
    name: Jira — Comment Build Result
    runs-on: ubuntu-latest
    needs: [package-extension]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    env:
      JIRA_CI_TOKEN: ${{ secrets.JIRA_CI_TOKEN }}
    steps:
      # checkout is REQUIRED: the ticket key is read from the commit subject
      # with `git log`, and without a checkout the runner has no .git, so that
      # call fails with "fatal: not a git repository" and takes the whole job
      # down. Shallow is enough — only the subject of HEAD is read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Comment on the ticket named in the commit subject
        if: ${{ env.JIRA_CI_TOKEN != '' }}
        env:
          VERSION: ${{ needs.package-extension.outputs.extension-version }}
          ARTIFACT: gemini-bridge-extension-v${{ needs.package-extension.outputs.extension-version }}-run${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          JIRA_BASE: ${{ vars.JIRA_BASE_URL || 'https://pansakorn.atlassian.net' }}
          JIRA_EMAIL: ${{ vars.JIRA_ACCOUNT_EMAIL }}
        run: |
          set -uo pipefail
          set +x

          # The governance hook enforces `^KAN-<id>` on the subject, so the
          # ticket key is recoverable from the commit message. PR merges and
          # squash commits keep the original subject, which is why this reads
          # the subject rather than the branch name.
          #
          # `|| true` because this job promises never to fail the build: the
          # extension is already built and uploaded by this point, and a red X
          # would misreport that. Without it, any unexpected error here — a
          # missing .git, a transient DNS failure — fails the job and with it
          # the whole run.
          SUBJECT=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          KEY=$(printf '%s' "$SUBJECT" | grep -oE '^KAN-[0-9]+' | head -1 || true)

          if [ -z "$KEY" ]; then
            echo "::notice::No KAN-<id> in commit subject ('$SUBJECT'); nothing to sync."
            exit 0
          fi
          if [ -z "$JIRA_EMAIL" ]; then
            echo "::warning::vars.JIRA_ACCOUNT_EMAIL is not set; cannot authenticate to Jira."
            echo "  Set it with: gh variable set JIRA_ACCOUNT_EMAIL --repo pphothidaen/gemini-web-bridge"
            exit 0
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # The comment text is assembled by jq below, not here.

          # Jira Cloud v3 needs Atlassian Document Format, wrapped in a "body"
          # Two steps, deliberately.
          #
          # 1. Build the comment text with jq -nr. Interpolation happens in a
          #    string context, so there are no nested parens to misbalance.
          #    A single combined object literal with the concatenation inline
          #    is a jq compile error ("unexpected INVALID_CHARACTER") — it
          #    parses as a filter and dies before writing anything, which
          #    surfaces as an empty file and Jira's "No content to map to
          #    Object due to end of input".
          # 2. Wrap that text in the ADF "body" envelope Jira Cloud v3
          #    requires. A bare ADF document is rejected with HTTP 400
          #    "Comment body can not be empty!", which reads like an auth
          #    problem and is not.
          #
          # Verified live: this exact pair returns 201 and produces the
          # expected comment text.
          TXT=$(jq -nr --arg v "$VERSION" --arg a "$ARTIFACT" --arg s "${COMMIT_SHA:0:7}" \
            --arg sha "$COMMIT_SHA" --arg run "$RUN_URL" --arg srv "$GITHUB_SERVER_URL" \
            '"Extension build **\($v)** finished.\n\n- Artifact: `\($a)`\n- Commit: [`\($s)`](\($srv)/commit/\($sha))\n- Run: [\($run)](\($run))"')
          jq -n --arg t "$TXT" \
            '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$t}]}]}}' > /tmp/adf.json

          # `|| echo 000` appends to whatever curl already printed, so a curl
          # that fails after writing its own %{http_code} yields "000000" and
          # matches no case. Use a separate variable and normalise instead.
          #
          # --max-time and --retry matter here: GitHub-hosted runners
          # occasionally drop an outbound connection mid-send, which surfaces
          # as curl (43) "Failed sending HTTP POST request" while the very
          # same host answers a GET with 200. That is a transport failure, not
          # a Jira or credential problem, and retrying is the correct
          # response. Without it the step reported HTTP 000 and gave up.
          # -u, not a hand-built Authorization header. The hand-built form
          # produced an Atlassian `http1.codec_error` (HTTP 400, an HTML page
          # rather than JSON) on the runner while working locally, so the
          # difference was in the header bytes. curl's -u builds and encodes
          # the credential itself, so the whole class of shell-level quoting
          # or encoding mistakes disappears.
          #
          # --http1.1 is required, not a preference: the same request over
          # HTTP/2 fails on the runner with curl (43) "Failed sending HTTP POST
          # request" (HTTP 000), while forced to HTTP/1.1 it returns a real
          # status. A GET to the same host returns 200 either way, so the
          # host, TLS and credentials are fine and the fault is specific to
          # that connection's HTTP/2 framing.
          #
          # --retry covers the same class of transient drop; --max-time stops
          # a hung connection from stalling the job.
          HTTP=$(curl -sS -o /tmp/jira.out -w '%{http_code}' \
            --http1.1 --max-time 30 --retry 3 --retry-delay 2 --retry-connrefused \
            -X POST "$JIRA_BASE/rest/api/3/issue/$KEY/comment" \
            -u "$JIRA_EMAIL:$JIRA_CI_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/adf.json 2>/tmp/curl.err) || HTTP=""
          HTTP=${HTTP:-000}

          # Never fail the build on a Jira problem: the extension is already
          # built and uploaded, and a red X here would misreport that.
          #
          # Note 404 is ambiguous by design on Jira's side: it means "issue does
          # not exist OR you cannot see it", and an invalid token gets the same
          # answer. Confirmed against the live API. So the message lists both
          # causes instead of asserting the first one, which is what sent me
          # looking for a missing ticket when the real problem was a bad token.
          case "$HTTP" in
            201|200) echo "✅ Commented on $KEY" ;;
            400) echo "::warning::Jira rejected the payload (HTTP 400). bytes=$(wc -c < /tmp/adf.json 2>/dev/null || echo NA) body=$(head -c 250 /tmp/adf.json 2>/dev/null | tr '\n' ' ') | response=$(head -c 250 /tmp/jira.out 2>/dev/null | tr '\n' ' ')" ;;
            404) echo "::warning::Jira returned 404 for $KEY. Either the ticket does not exist, or the token cannot see it (Jira reports both identically — an invalid or under-scoped token also gets 404, not 401)."; head -c 200 /tmp/jira.out || true; echo ;;
            401|403) echo "::warning::Jira rejected the token (HTTP $HTTP). Token may be expired or lack write scope." ;;
            *)  echo "::warning::Jira comment failed (HTTP $HTTP). curl: $(head -c 200 /tmp/curl.err 2>/dev/null | tr '\n' ' ') | response: $(head -c 300 /tmp/jira.out 2>/dev/null | tr '\n' ' ')" ;;
          esac

          # Explicit success. A step's exit status is the status of its LAST
          # command, and the `case` above is the last one — so a head that
          # found nothing to read, or a jq/printf that failed upstream, left a
          # non-zero status here and failed the job despite the warnings
          # above. This is the actual "never fail the build" enforcement;
          # the `|| true` guards merely make the noise legible.
          exit 0

  # ─── Job 6: Redteam — Token Validation ────────────────────────
  #
  # Asserts the *credential*, not the app. Every probe below hits an endpoint
  # whose response is decided purely by the token:
  #
  #   GET /v1/models         -> 200 = token valid, 401 = token rejected
  #   GET /bridge/auth-check -> 200 = token valid, 401 = token rejected
  #
  # This deliberately does NOT use POST /v1/chat/completions, which is what
  # this job used to do. That probe was doubly broken:
  #   1. It requested `model: "gemini-3.8-flash-thinking"`, which is no longer
  #      in the browser catalog (live catalog is gemini-3.8-flash,
  #      gemini-3.5-flash-lite, gemini-3.1-pro). A *valid* token therefore
  #      returns 404 model_not_available, conflating "token rejected" with
  #      "model id retired" — the job could never observe the 200 it asserted.
  #   2. A completion depends on a live browser extension, so a disconnected
  #      extension (normal at any hour) reads as a credential failure.
  redteam-token-test:
    name: Redteam — Token Validation
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Token validation (auth-only probes, no hardcoded secrets)
        env:
          OLD_CLIENT_TOKEN: ${{ secrets.OLD_CLIENT_API_KEY }}
          CURRENT_CLIENT_TOKEN: ${{ secrets.CLIENT_API_KEY }}
          OLD_BRIDGE_AUTH_TOKEN: ${{ secrets.OLD_BRIDGE_AUTH_TOKEN }}
          CURRENT_BRIDGE_AUTH_TOKEN: ${{ secrets.BRIDGE_AUTH_TOKEN }}
          BASE_URL: ${{ vars.PROD_BASE_URL || 'https://prod.gemini-web-bridge.workers.dev' }}
        run: |
          echo "## 🔴 Redteam — Token Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # probe <url> <header-line>  ->  prints "<http_code> <curl_exit>"
          #
          # <header-line> is a COMPLETE header, e.g. "Authorization: Bearer $TOK"
          # or "x-bridge-token: $TOK". Do not split the header name from its
          # value: rebuilding it as "$NAME: $VALUE" turns
          # "Authorization: Bearer <tok>" into "Authorization: Bearer: <tok>",
          # which authenticates as the literal token "Bearer: <tok>" and returns
          # a 401 indistinguishable from a revoked credential.
          #
          # `|| true` is also load-bearing. GitHub runs steps under `bash -e`, so
          # a bare `HTTP_CODE=$(curl ...)` aborts the step the moment curl returns
          # non-zero — which is how this job died with exit 23 before reaching
          # any of its own assertions. A transport failure must be *reported*
          # and routed to the rerun branch, never kill the step implicitly.
          probe() {
            local code rc
            code=$(curl -s --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                     -o /dev/null -w '%{http_code}' -H "$2" "$1") && rc=0 || rc=$?
            echo "${code:-000} $rc"
          }

          # assert_valid <label> <url> <header-line> — token must authenticate.
          assert_valid() {
            local label="$1" url="$2" header="$3" code rc
            if [ -z "${header##*: }" ] || [ -z "$header" ]; then
              echo "⚠️ $label: not configured — skipping" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            read -r code rc <<<"$(probe "$url" "$header")"
            if [ "$rc" != "0" ]; then
              echo "⚠️ $label: transport failure (curl exit $rc) — rerun this job" >> $GITHUB_STEP_SUMMARY
              return 2
            fi
            if [ "$code" = "200" ]; then
              echo "✅ $label: accepted (HTTP 200)" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            if [ "$code" = "401" ]; then
              echo "❌ $label: REJECTED (401) — GitHub and the worker disagree on the credential" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $label: expected 200, got HTTP $code" >> $GITHUB_STEP_SUMMARY
            fi
            return 1
          }

          # assert_revoked <label> <url> <header-line> — token must be rejected.
          assert_revoked() {
            local label="$1" url="$2" header="$3" code rc
            if [ -z "${header##*: }" ] || [ -z "$header" ]; then
              echo "ℹ️ $label: not configured — skipping" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            read -r code rc <<<"$(probe "$url" "$header")"
            if [ "$rc" != "0" ]; then
              echo "⚠️ $label: transport failure (curl exit $rc) — rerun this job" >> $GITHUB_STEP_SUMMARY
              return 2
            fi
            if [ "$code" = "401" ]; then
              echo "✅ $label: rejected (HTTP 401)" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            echo "❌ SECURITY ISSUE: $label still authenticates (HTTP $code, expected 401) — rotate it" >> $GITHUB_STEP_SUMMARY
            return 1
          }

          # 0 = pass, 2 = transient (rerun), 1 = real failure
          FAILURES=0
          TRANSIENT=0
          run_check() {
            local rc=0
            "$@" || rc=$?
            case "$rc" in
              0) ;;
              2) TRANSIENT=1 ;;
              *) FAILURES=$((FAILURES + 1)) ;;
            esac
          }

          # Live credentials must work.
          run_check assert_valid "Current CLIENT_API_KEY"  "$BASE_URL/v1/models"         "Authorization: Bearer $CURRENT_CLIENT_TOKEN"
          run_check assert_valid "Current BRIDGE_AUTH_TOKEN" "$BASE_URL/bridge/auth-check" "x-bridge-token: $CURRENT_BRIDGE_AUTH_TOKEN"

          # Retired credentials must NOT work. These are the assertions that
          # went red on 3e46a0f: both tokens were still live in production.
          run_check assert_revoked "Old CLIENT_API_KEY"  "$BASE_URL/v1/models"         "Authorization: Bearer $OLD_CLIENT_TOKEN"
          run_check assert_revoked "Old BRIDGE_AUTH_TOKEN" "$BASE_URL/bridge/auth-check" "x-bridge-token: $OLD_BRIDGE_AUTH_TOKEN"

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$TRANSIENT" = "1" ]; then
            echo "⚠️ Transient network failure — rerun this job" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [ "$FAILURES" -gt 0 ]; then
            echo "❌ $FAILURES check(s) failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All token validation checks passed" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy ──────────────────────────────────────────────────────
  # Production deployment is intentionally NOT done here. It lives in
  # cd.yml ("CD — Deploy & Secret Sync"), which owns the whole path:
  # fetch secrets from Doppler -> approve -> deploy production -> verify.
  #
  # This job used to deploy as well, so every push to main ran two concurrent
  # `wrangler deploy`s against the same worker with no concurrency group — a
  # race with no defined winner. cd.yml is now the single deploy authority.
  #
  # This workflow is verify-only: lint, test, security scan, deps, package,
  # redteam token validation.

