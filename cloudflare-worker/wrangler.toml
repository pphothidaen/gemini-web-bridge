name = "gemini-web-bridge"
main = "src/index.js"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

# Enable workers.dev — this worker is accessible at gemini-web-bridge.pansakorn-pho.workers.dev
# Note: route binding via API is not allowed on account's default workers.dev subdomain.
# The route was created via Cloudflare Dashboard and workers_dev = true keeps it active.
workers_dev = true

# Configure BRIDGE_AUTH_TOKEN and CLIENT_API_TOKEN with wrangler secret put.

# Gitleaks: allow .env to exist locally but NEVER commit it (see .gitignore)
# Doppler secrets are downloaded to .env for local dev only.

[durable_objects]
bindings = [
  { name = "BRIDGE_DO", class_name = "GeminiBridgeDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiBridgeDO"]

[observability]
enabled = true